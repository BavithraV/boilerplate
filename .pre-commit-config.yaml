
repos:
  # 🔐 SECRET DETECTION (ADD THIS)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # ⚡ LINT
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
      - id: ruff-format

  # 🎨 FORMAT
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black